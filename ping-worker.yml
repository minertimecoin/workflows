name: Ping TON deposit checker every 15 seconds

on:
  schedule:
    - cron: "*/1 * * * *" # GitHub запускает каждые 1 минуту
  workflow_dispatch: # возможность вручную запустить

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Four TON pings every 15 seconds
        run: |
          for i in 1 2 3 4; do
            echo "💎 TON check $i ($(date +'%H:%M:%S'))"
            curl -s -o /dev/null -w "%{http_code}" "https://miner.one-oh-one.app/api/cron_deposits_ton" || true
            if [ $i -lt 4 ]; then
              sleep 15
            fi
          done

